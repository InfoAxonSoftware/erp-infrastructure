services:

  postgres:
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 384m
    mem_reservation: 192m
    # max_connections=40 backends + a handful of background workers (writer,
    # checkpointer, autovacuum, wal sender) top out well under 100 tasks.
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  odoo:
    restart: unless-stopped
    cpus: "0.70"
    mem_limit: 900m
    mem_reservation: 512m
    # workers=0 (gevent, single process/threaded); headroom kept for report
    # rendering (wkhtmltopdf) and module-install subprocesses.
    pids_limit: 200
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  react:
    restart: unless-stopped
    cpus: "0.05"
    mem_limit: 96m
    mem_reservation: 32m
    # Static-file nginx only, no reverse-proxy load; small margin above a
    # typical low-core worker_processes-auto count.
    pids_limit: 50
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  nginx:
    restart: unless-stopped
    cpus: "0.10"
    mem_limit: 96m
    mem_reservation: 32m
    # Reverse proxy: master + worker_processes-auto workers, headroom for
    # a larger host's core count even under a small cpus quota.
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  company-backend:
    restart: unless-stopped
    cpus: "0.20"
    mem_limit: 256m
    mem_reservation: 96m
    # Node main thread + libuv thread pool + Prisma query engine; margin for
    # occasional child processes.
    pids_limit: 128
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
